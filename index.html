<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <title>Scout</title>

    <!-- Telegram Mini App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: #000;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #242424 0%,
                    #101010 45%,
                    #000000 100%
                );

            color: #ffffff;

            padding:
                calc(env(safe-area-inset-top) + 20px)
                20px
                calc(env(safe-area-inset-bottom) + 30px);

            overflow-x: hidden;
        }

        .app {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.12);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);

            border-radius: 28px;
        }

        .hero {
            padding: 32px 24px;
            text-align: center;

            animation: appear 0.7s ease;
        }

        .logo {
            width: 72px;
            height: 72px;

            margin: 0 auto 20px;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.22),
                    rgba(255,255,255,0.05)
                );

            box-shadow:
                inset 0 1px 1px rgba(255,255,255,0.2),
                0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            margin: 0;

            font-size: 34px;
            line-height: 1.05;

            letter-spacing: -1.5px;
        }

        .subtitle {
            margin: 14px 0 0;

            font-size: 17px;
            line-height: 1.45;

            color: rgba(255,255,255,0.65);
        }

        .user-card {
            margin-top: 16px;
            padding: 18px 20px;

            display: none;

            animation: appear 0.5s ease;
        }

        .user-label {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 5px;
        }

        .user-name {
            font-size: 18px;
            font-weight: 600;
        }

        .section {
            margin-top: 16px;
            padding: 22px;

            animation: appear 0.8s ease;
        }

        .section-title {
            font-size: 21px;
            font-weight: 700;

            margin-bottom: 8px;
        }

        .section-text {
            font-size: 15px;
            line-height: 1.5;

            color: rgba(255,255,255,0.62);
        }

        .button {
            width: 100%;

            margin-top: 20px;

            padding: 17px 20px;

            border: none;
            border-radius: 20px;

            background: #ffffff;
            color: #000000;

            font-size: 17px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        .button:active {
            transform: scale(0.97);
            opacity: 0.8;
        }

        .footer {
            padding: 25px 10px;

            text-align: center;

            font-size: 13px;

            color: rgba(255,255,255,0.35);
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

    </style>

</head>

<body>

<div class="app">

    <div class="glass hero">

        <div class="logo">
            🚀
        </div>

        <h1>
            Scout
        </h1>

        <p class="subtitle">
            Добро пожаловать в наше приложение
        </p>

        <button
            class="button"
            id="startButton"
        >
            Начать
        </button>

    </div>


    <div
        class="glass user-card"
        id="userCard"
    >

        <div class="user-label">
            Вы вошли как
        </div>

        <div
            class="user-name"
            id="userName"
        >
        </div>

    </div>


    <div class="glass section">

        <div class="section-title">
            Всё готово 🚀
        </div>

        <div class="section-text">
            Это базовая версия нашего Telegram Mini App.
            Дальше здесь появятся фотографии, видео,
            информация, анкета и другие функции.
        </div>

    </div>


    <div class="footer">
        Telegram Mini App
    </div>

</div>


<script>

    const tg = window.Telegram.WebApp;

    // Сообщаем Telegram, что приложение загружено
    tg.ready();

    // Разворачиваем Mini App
    tg.expand();


    // Получаем данные пользователя Telegram
    const user = tg.initDataUnsafe?.user;


    if (user) {

        const userCard =
            document.getElementById("userCard");

        const userName =
            document.getElementById("userName");

        let name = user.first_name || "";

        if (user.last_name) {
            name += " " + user.last_name;
        }

        if (user.username) {
            name += "  @" + user.username;
        }

        userName.textContent = name;

        userCard.style.display = "block";
    }


    // Кнопка "Начать"
    document
        .getElementById("startButton")
        .addEventListener("click", () => {

            tg.HapticFeedback?.impactOccurred("light");

            alert("Отлично! Начинаем 🚀");

        });


    // Настройка цвета интерфейса Telegram
    if (tg.setHeaderColor) {
        tg.setHeaderColor("#000000");
    }

    if (tg.setBackgroundColor) {
        tg.setBackgroundColor("#000000");
    }

</script>

</body>

</html>
