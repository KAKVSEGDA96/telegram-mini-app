    <meta

        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>My Mini App</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;

            background: #111111;
            color: white;

            text-align: center;
        }

        .container {
            padding: 30px;
