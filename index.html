<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Анкета</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    #243044 0%,
                    #11151c 45%,
                    #07090d 100%
                );
            color: white;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                Arial,
                sans-serif;
        }

        .app {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 18px 40px;
        }

        .glass {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            padding: 22px;
            box-shadow:
                0 20px 60px rgba(0,0,0,0.35);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: appear .3s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            margin: 0 0 10px;
            font-size: 30px;
            line-height: 1.1;
        }

        h2 {
            margin: 0 0 18px;
            font-size: 24px;
        }

        p {
            color: rgba(255,255,255,0.65);
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: rgba(255,255,255,0.75);
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
            outline: none;
            background: rgba(255,255,255,0.08);
            color: white;
            border-radius: 18px;
            padding: 15px 16px;
            font-size: 17px;
            font-family: inherit;
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255,255,255,0.35);
        }

        textarea {
            min-height: 150px;
            resize: none;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 18px;
            padding: 16px;
            margin-top: 18px;
            font-size: 17px;
            font-weight: 600;
            color: white;
            background: rgba(255,255,255,0.14);
        }

        button:active {
            transform: scale(0.98);
        }

        .primary {
            background: #ffffff;
            color: #111;
        }

        .contact-button {
            background: rgba(70,150,255,0.22);
        }

        .success-button {
            background: rgba(50,200,120,0.25);
        }

        .choice {
            display: block;
            margin-top: 12px;
            padding: 17px;
            border-radius: 18px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .choice input {
            width: auto;
            margin-right: 10px;
        }

        .files {
            margin-top: 15px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            margin-top: 8px;
            background: rgba(255,255,255,0.07);
            border-radius: 15px;
        }

        .file-item button {
            width: auto;
            margin: 0;
            padding: 8px 12px;
            font-size: 13px;
        }

        .preview {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 16px;
            margin-top: 8px;
        }

        .summary {
            background: rgba(255,255,255,0.06);
            padding: 15px;
            border-radius: 18px;
            margin-top: 12px;
        }

        .summary strong {
            display: block;
            margin-bottom: 4px;
        }

        .back {
            background: transparent;
            color: rgba(255,255,255,0.55);
        }

        .progress {
            height: 5px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 14%;
            background: white;
            border-radius: 10px;
            transition: width .3s ease;
        }

        .success {
            text-align: center;
            padding: 40px 10px;
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

    </style>
</head>

<body>

<div class="app">

    <div class="progress">
        <div
            class="progress-bar"
            id="progressBar">
        </div>
    </div>

    <div class="glass">

        <!-- ЭКРАН 1 -->

        <section
            class="screen active"
            id="screen1">

            <h1>Контакт</h1>

            <p>
                Заполните основные контактные данные.
            </p>

            <label>Имя</label>

            <input
                id="name"
                type="text"
                placeholder="Ваше имя"
            >

            <label>Телефон</label>

            <input
                id="phone"
                type="tel"
                placeholder="Номер телефона"
            >

            <button
                class="contact-button"
                id="contactButton"
                type="button"
            >
                📱 Поделиться номером
            </button>

            <button
                class="primary"
                type="button"
                onclick="nextScreen(2)"
            >
                Продолжить
            </button>

        </section>


        <!-- ЭКРАН 2 -->

        <section
            class="screen"
            id="screen2">

            <h2>Параметры</h2>

            <label>Рост</label>

            <input
                id="height"
                type="text"
                placeholder="Например, 170 см"
            >

            <label>Вес</label>

            <input
                id="weight"
                type="text"
                placeholder="Например, 50 кг"
            >

            <label>Возраст</label>

            <input
                id="age"
                type="number"
                placeholder="Ваш возраст"
            >

            <button
                class="primary"
                type="button"
                onclick="nextScreen(3)"
            >
                Продолжить
            </button>

            <button
                class="back"
                type="button"
                onclick="nextScreen(1)"
            >
                Назад
            </button>

        </section>


        <!-- ЭКРАН 3 -->

        <section
            class="screen"
            id="screen3">

            <h2>Дополнительная информация</h2>

            <textarea
                id="additional"
                placeholder="Дополнить от себя"
            ></textarea>

            <button
                class="primary"
                type="button"
                onclick="nextScreen(4)"
            >
                Продолжить
            </button>

            <button
                class="back"
                type="button"
                onclick="nextScreen(2)"
            >
                Назад
            </button>

        </section>


        <!-- ЭКРАН 4 -->

        <section
            class="screen"
            id="screen4">

            <h2>Укажите свое гражданство</h2>

            <textarea
                id="citizenship"
                placeholder="Например: Казахстан"
            ></textarea>

            <button
                class="primary"
                type="button"
                onclick="nextScreen(5)"
            >
                Продолжить
            </button>

            <button
                class="back"
                type="button"
                onclick="nextScreen(3)"
            >
                Назад
            </button>

        </section>


        <!-- ЭКРАН 5 -->

        <section
            class="screen"
            id="screen5">

            <h2>Дополнительные вопросы</h2>

            <p>Вас интересует?</p>

            <label class="choice">

                <input
                    type="radio"
                    name="interest"
                    value="1 пункт"
                >

                1 пункт

            </label>

            <label class="choice">

                <input
                    type="radio"
                    name="interest"
                    value="2 пункт"
                >

                2 пункт

            </label>

            <label class="choice">

                <input
                    type="radio"
                    name="interest"
                    value="3 пункт"
                >

                3 пункт

            </label>

            <label class="choice">

                <input
                    type="radio"
                    name="interest"
                    value="4 пункт"
                >

                4 пункт

            </label>

            <button
                class="primary"
                type="button"
                onclick="nextScreen(6)"
            >
                Продолжить
            </button>

            <button
                class="back"
                type="button"
                onclick="nextScreen(4)"
            >
                Назад
            </button>

        </section>


        <!-- ЭКРАН 6 -->

        <section
            class="screen"
            id="screen6">

            <h2>Материалы</h2>

            <p>
                Прикрепите фотографии или видео.
            </p>

            <button
                type="button"
                onclick="document.getElementById('cameraInput').click()"
            >
                📷 Сделать фото
            </button>

            <input
                id="cameraInput"
                type="file"
                accept="image/*"
                capture="environment"
                multiple
                hidden
            >

            <button
                type="button"
                onclick="document.getElementById('photoInput').click()"
            >
                🖼️ Выбрать фотографии
            </button>

            <input
                id="photoInput"
                type="file"
                accept="image/*"
                multiple
                hidden
            >

            <button
                type="button"
                onclick="document.getElementById('videoInput').click()"
            >
                🎥 Выбрать видео
            </button>

            <input
                id="videoInput"
                type="file"
                accept="video/*"
                multiple
                hidden
            >

            <div
                class="files"
                id="filesContainer">
            </div>

            <button
                class="primary"
                type="button"
                onclick="nextScreen(7)"
            >
                Продолжить
            </button>

            <button
                class="back"
                type="button"
                onclick="nextScreen(5)"
            >
                Назад
            </button>

        </section>


        <!-- ЭКРАН 7 -->

        <section
            class="screen"
            id="screen7">

            <h2>Подтверждение</h2>

            <div
                class="summary"
                id="summary">
            </div>

            <button
                class="primary"
                id="submitButton"
                type="button"
                onclick="submitForm()"
            >
                ✅ Отправить анкету
            </button>

            <button
                class="back"
                type="button"
                onclick="nextScreen(6)"
            >
                Назад
            </button>

        </section>


        <!-- УСПЕШНАЯ ОТПРАВКА -->

        <section
            class="screen"
            id="successScreen">

            <div class="success">

                <div class="success-icon">
                    ✅
                </div>

                <h1>
                    Спасибо!
                </h1>

                <p>
                    Анкета успешно отправлена.
                </p>

            </div>

        </section>

    </div>

</div>


<script>

    const tg =
        window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    try {
        tg.setHeaderColor("#000000");
        tg.setBackgroundColor("#000000");
    } catch (error) {
        console.log(error);
    }


    /*
     * TELEGRAM USER
     */

    const telegramUser =
        tg.initDataUnsafe?.user;

    if (telegramUser) {

        const nameInput =
            document.getElementById("name");

        if (!nameInput.value) {

            nameInput.value =
                [
                    telegramUser.first_name,
                    telegramUser.last_name
                ]
                .filter(Boolean)
                .join(" ");

        }

        console.log(
            "Telegram ID:",
            telegramUser.id
        );

    }


    /*
     * ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
     */

    let currentScreen = 1;


    function nextScreen(number) {

        document
            .querySelectorAll(".screen")
            .forEach(
                screen => {
                    screen.classList.remove(
                        "active"
                    );
                }
            );


        const screen =
            document.getElementById(
                "screen" + number
            );


        if (screen) {

            screen.classList.add(
                "active"
            );

        }


        currentScreen =
            number;


        updateProgress();


        if (number === 7) {

            buildSummary();

        }


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


        try {
            tg.HapticFeedback
                ?.impactOccurred("light");
        } catch (error) {}

    }


    function updateProgress() {

        const progress =
            document.getElementById(
                "progressBar"
            );

        const percent =
            (currentScreen / 7) * 100;

        progress.style.width =
            percent + "%";

    }


    /*
     * TELEGRAM CONTACT
     */

    const contactButton =
        document.getElementById(
            "contactButton"
        );


    contactButton.addEventListener(
        "click",
        () => {

            if (
                typeof tg.requestContact ===
                "function"
            ) {

                tg.requestContact(
                    (shared) => {

                        if (shared) {

                            contactButton.textContent =
                                "✅ Запрос отправлен";

                            contactButton.classList.add(
                                "success-button"
                            );

                        }

                    }
                );

            } else {

                alert(
                    "Эта функция доступна только внутри Telegram."
                );

            }

        }
    );


    /*
     * ФАЙЛЫ
     */

    let selectedFiles = [];


    function addFiles(
        fileList
    ) {

        const files =
            Array.from(fileList);


        selectedFiles =
            selectedFiles.concat(
                files
            );


        renderFiles();

    }


    function removeFile(
        index
    ) {

        selectedFiles.splice(
            index,
            1
        );

        renderFiles();

    }


    function renderFiles() {

        const container =
            document.getElementById(
                "filesContainer"
            );


        container.innerHTML = "";


        selectedFiles.forEach(
            (file, index) => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "file-item";


                const left =
                    document.createElement(
                        "div"
                    );


                left.style.width =
                    "75%";


                left.innerHTML =
                    "📎 " +
                    file.name;


                if (
                    file.type.startsWith(
                        "image/"
                    )
                ) {

                    const img =
                        document.createElement(
                            "img"
                        );

                    img.className =
                        "preview";


                    img.src =
                        URL.createObjectURL(
                            file
                        );


                    left.appendChild(
                        img
                    );

                }


                if (
                    file.type.startsWith(
                        "video/"
                    )
                ) {

                    const video =
                        document.createElement(
                            "video"
                        );

                    video.className =
                        "preview";

                    video.controls =
                        true;

                    video.src =
                        URL.createObjectURL(
                            file
                        );

                    left.appendChild(
                        video
                    );

                }


                const remove =
                    document.createElement(
                        "button"
                    );

                remove.textContent =
                    "Удалить";


                remove.onclick =
                    () => removeFile(
                        index
                    );


                item.appendChild(
                    left
                );

                item.appendChild(
                    remove
                );


                container.appendChild(
                    item
                );

            }
        );

    }


    document
        .getElementById("cameraInput")
        .addEventListener(
            "change",
            event => {

                addFiles(
                    event.target.files
                );

                event.target.value =
                    "";

            }
        );


    document
        .getElementById("photoInput")
        .addEventListener(
            "change",
            event => {

                addFiles(
                    event.target.files
                );

                event.target.value =
                    "";

            }
        );


    document
        .getElementById("videoInput")
        .addEventListener(
            "change",
            event => {

                addFiles(
                    event.target.files
                );

                event.target.value =
                    "";

            }
        );


    /*
     * ПОДТВЕРЖДЕНИЕ
     */

    function buildSummary() {

        const name =
            document.getElementById(
                "name"
            ).value;


        const phone =
            document.getElementById(
                "phone"
            ).value;


        const height =
            document.getElementById(
                "height"
            ).value;


        const weight =
            document.getElementById(
                "weight"
            ).value;


        const age =
            document.getElementById(
                "age"
            ).value;


        const additional =
            document.getElementById(
                "additional"
            ).value;


        const citizenship =
            document.getElementById(
                "citizenship"
            ).value;


        const interest =
            document.querySelector(
                'input[name="interest"]:checked'
            )?.value ||
            "Не выбран";


        const summary =
            document.getElementById(
                "summary"
            );


        summary.innerHTML = `

            <strong>Имя</strong>
            ${escapeHtml(name) || "—"}

            <br><br>

            <strong>Телефон</strong>
            ${escapeHtml(phone) || "—"}

            <br><br>

            <strong>Рост</strong>
            ${escapeHtml(height) || "—"}

            <br><br>

            <strong>Вес</strong>
            ${escapeHtml(weight) || "—"}

            <br><br>

            <strong>Возраст</strong>
            ${escapeHtml(age) || "—"}

            <br><br>

            <strong>Дополнительная информация</strong>
            ${escapeHtml(additional) || "—"}

            <br><br>

            <strong>Гражданство</strong>
            ${escapeHtml(citizenship) || "—"}

            <br><br>

            <strong>Вас интересует</strong>
            ${escapeHtml(interest)}

            <br><br>

            <strong>Файлы</strong>
            ${selectedFiles.length}

        `;

    }


    /*
     * ЗАЩИТА ОТ HTML
     */

    function escapeHtml(
        text
    ) {

        return String(text || "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /*
     * ОТПРАВКА АНКЕТЫ
     */

    async function submitForm() {

        const button =
            document.getElementById(
                "submitButton"
            );


        button.disabled =
            true;


        button.textContent =
            "⏳ Отправляем...";


        const user =
            tg.initDataUnsafe?.user;


        const interest =
            document.querySelector(
                'input[name="interest"]:checked'
            )?.value ||
            null;


        const application = {

            type:
                "application",


            telegram_id:
                user?.id ||
                null,


            telegram_username:
                user?.username ||
                null,


            telegram_first_name:
                user?.first_name ||
                null,


            telegram_last_name:
                user?.last_name ||
                null,


            name:
                document.getElementById(
                    "name"
                ).value,


            phone:
                document.getElementById(
                    "phone"
                ).value,


            height:
                document.getElementById(
                    "height"
                ).value,


            weight:
                document.getElementById(
                    "weight"
                ).value,


            age:
                document.getElementById(
                    "age"
                ).value,


            additional:
                document.getElementById(
                    "additional"
                ).value,


            citizenship:
                document.getElementById(
                    "citizenship"
                ).value,


            interest:
                interest,


            files_count:
                selectedFiles.length,


            submitted_at:
                new Date().toISOString()

        };


        console.log(
            "APPLICATION:",
            application
        );


        try {

            const response =
                await fetch(
                    "https://telegram-mini-app-bot.wdb7hjzf97.workers.dev",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                application
                            )
                    }
                );


            const result =
                await response.text();


            console.log(
                "Worker response:",
                result
            );


            if (!response.ok) {

                throw new Error(
                    "Worker error: " +
                    response.status
                );

            }


            document
                .querySelectorAll(
                    ".screen"
                )
                .forEach(
                    screen => {
                        screen.classList.remove(
                            "active"
                        );
                    }
                );


            document
                .getElementById(
                    "successScreen"
                )
                .classList.add(
                    "active"
                );


            document
                .getElementById(
                    "progressBar"
                )
                .style.width =
                "100%";


            try {

                tg.HapticFeedback
                    ?.notificationOccurred(
                        "success"
                    );

            } catch (error) {}

        }

        catch (error) {

            console.error(
                error
            );


            button.disabled =
                false;


            button.textContent =
                "❌ Ошибка. Попробовать ещё раз";


            alert(
                "Не удалось отправить анкету.\n\n" +
                error.message
            );

        }

    }


    /*
     * НАЧАЛЬНЫЙ ПРОГРЕСС
     */

    updateProgress();

</script>

</body>
</html>
